services:
  - type: web
    name: dar-alsalam-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "No build step required"
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_NAME
        value: مشرف دار السلام
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_CODE
        sync: false
